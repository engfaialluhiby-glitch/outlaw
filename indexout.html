<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم كركترات اوتلاو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: night-time RP server poster, confident and playful
   IDEA: a squad roster board pinned in a dark briefing room
   PICTURE: the tier board itself, framed by the server logo glow
   COLOUR/TYPE: deep navy from the logo, teal accent, vivid tier colours; Lalezar for headings, Tajawal body
   LAYOUT: logo + title centred, board, roster pool, actions */
:root{--cols:7;--bg:#09131c;--panel:#101f2b;--cell:#0c1822;--line:rgba(120,200,215,.12);--teal:#4fb8c4;--ink:#eef4f6;--muted:#86a3b1}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:16px/1.5 Tajawal,Tahoma,sans-serif;overflow-x:clip;min-height:100vh;
 background:radial-gradient(900px 520px at 50% -120px,rgba(79,184,196,.28),transparent 70%),radial-gradient(700px 500px at 100% 100%,rgba(79,184,196,.08),transparent 70%),var(--bg)}
.wm{position:fixed;inset:auto -18vw -18vw auto;width:70vw;max-width:760px;aspect-ratio:1;border-radius:50%;background-size:cover;opacity:.06;pointer-events:none;filter:grayscale(.3)}
.wrap{position:relative;max-width:900px;margin:0 auto;padding:28px 14px 56px}
header{text-align:center;margin-bottom:22px}
.logo{width:clamp(88px,18vw,120px);aspect-ratio:1;border-radius:50%;object-fit:cover;display:block;margin:0 auto 14px;border:3px solid var(--teal);
 box-shadow:0 0 0 8px rgba(79,184,196,.12),0 0 50px rgba(79,184,196,.45)}
h1{font-family:Lalezar,Tahoma,sans-serif;font-weight:400;font-size:clamp(34px,7vw,56px);line-height:1.05;margin:0;outline:none;text-shadow:0 4px 24px rgba(0,0,0,.5)}
.rule{width:120px;height:3px;border-radius:3px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--teal),transparent)}
.sub{margin:8px 0 0;color:var(--muted);font-size:15px}
.board{background:var(--panel);border:1px solid rgba(79,184,196,.45);border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 6px rgba(79,184,196,.06),0 0 60px rgba(79,184,196,.12)}
.row{display:flex;border-bottom:1px solid rgba(79,184,196,.18)}
.row:last-child{border-bottom:0}
.label{flex:0 0 clamp(84px,18%,140px);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;
 font-family:Lalezar,Tahoma,sans-serif;font-size:clamp(19px,3.8vw,32px);line-height:1.05;outline:none;word-break:keep-all;
 position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset -6px 0 14px rgba(0,0,0,.18);text-shadow:0 2px 6px rgba(0,0,0,.25)}
.zw{flex:1;container-type:inline-size}
.row:first-child .label{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 30px rgba(111,224,234,.35)}
.zone{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:calc(100cqw / var(--cols));min-height:calc(100cqw / var(--cols));height:100%;
 background-color:var(--cell);
 background-image:linear-gradient(to left,var(--line) 1px,transparent 1px),linear-gradient(to bottom,transparent calc(100% - 1px),var(--line) 1px);
 background-size:calc(100cqw / var(--cols)) calc(100cqw / var(--cols));background-position:right top;transition:background-color .2s}
.zone.over,.zone.hot{background-color:#132836}
.card-i{cursor:grab;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .18s}
.card-i{position:relative}
.badge{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);white-space:nowrap;
 font:800 10px/1 Tajawal,Tahoma,sans-serif;color:#fff;background:#b3161f;border:1px solid #ff8a90;border-radius:99px;padding:3px 7px;box-shadow:0 2px 6px rgba(0,0,0,.5);pointer-events:none;z-index:2}
.zone .badge{bottom:7px;font-size:9px;padding:2px 6px}
.card-i img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.zone .card-i{padding:4px;animation:pop .25s ease}
.zone .card-i img{border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.card-i:hover{transform:translateY(-2px)}
.card-i.sel img{outline:3px solid var(--teal);outline-offset:2px;box-shadow:0 0 18px rgba(79,184,196,.7)}
@keyframes pop{from{transform:scale(.8);opacity:.4}to{transform:none;opacity:1}}
.roster{margin-top:18px;background:var(--panel);border:1px solid rgba(79,184,196,.2);border-radius:22px;padding:16px 16px 20px}
.roster h2{font-family:Lalezar,Tahoma,sans-serif;font-weight:400;font-size:24px;margin:0 4px 12px;display:flex;align-items:center;gap:10px}
.count{font:800 13px Tajawal,sans-serif;background:rgba(79,184,196,.16);color:var(--teal);border-radius:99px;padding:3px 11px}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:84px;border-radius:14px;transition:background .2s}
.pool.over{background:rgba(79,184,196,.08)}
.pool .card-i{width:clamp(58px,11vw,76px);aspect-ratio:1}
.pool .card-i img{border-radius:50%;border:2px solid rgba(79,184,196,.55);box-shadow:0 4px 12px rgba(0,0,0,.45)}
.pool .card-i:hover img{border-color:var(--teal);box-shadow:0 0 16px rgba(79,184,196,.55)}
.empty{color:var(--muted);align-self:center;font-size:15px}
.bar{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
button{font:800 16px Tajawal,Tahoma,sans-serif;border:0;border-radius:14px;padding:13px 26px;cursor:pointer;min-height:48px;transition:transform .15s,box-shadow .15s}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.primary{background:linear-gradient(180deg,#6fd3de,#3aa3b0);color:#07121a;box-shadow:0 8px 24px rgba(79,184,196,.35)}
.primary:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(79,184,196,.5)}
.ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid rgba(255,255,255,.14)}
.hint{text-align:center;color:var(--muted);font-size:14px;margin:12px 0 0}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:8;
 font-family:Lalezar,Tahoma,sans-serif;font-size:clamp(26px,6vw,46px);line-height:1.2;text-align:center;color:#fff;
 background:linear-gradient(160deg,#e23a43,#9a1119);padding:18px 30px;border-radius:20px;border:2px solid #ff8a90;
 box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 60px rgba(226,58,67,.55);transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .25s;max-width:90vw}
@media (min-width:600px){#toast{white-space:nowrap}}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
.card-i.nope img{outline:4px solid #ff3b45!important;outline-offset:-2px;box-shadow:0 0 24px rgba(255,59,69,.9)!important}
.card-i.nope{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(7px) rotate(4deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#ov{position:fixed;inset:0;background:rgba(4,9,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:9}
#ov[hidden]{display:none}
#ov img{max-width:100%;max-height:74vh;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
@media (max-width:600px){:root{--cols:4}.label{flex-basis:76px;font-size:18px;padding:4px}.zone .card-i{padding:3px}.wrap{padding-top:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const TIERS=[
 {n:'أسطوري',a:'#a6f4f7',b:'#4fc3cf',c:'#05202a'},
 {n:'ممتاز',a:'#6fd0da',b:'#2f97a8',c:'#03161d'},
 {n:'جيد',a:'#45a6c6',b:'#1f6f93',c:'#ffffff'},
 {n:'عادي',a:'#3079ad',b:'#1a4c7c',c:'#ffffff'},
 {n:'مهرجين',a:'#27578f',b:'#16325e',c:'#ffffff'},
 {n:'اتمنى يعدم',a:'#172c50',b:'#070f1f',c:'#ffffff'}
];
const board=document.getElementById('board'),pool=document.getElementById('pool'),count=document.getElementById('count');
board.innerHTML=TIERS.map(t=>'<div class="row"><div class="label" contenteditable="true" data-a="'+t.a+'" data-b="'+t.b+'" style="background:linear-gradient(160deg,'+t.a+','+t.b+');color:'+t.c+'">'+t.n+'</div><div class="zw"><div class="zone"></div></div></div>').join('');
const PRANK=new Set([4,11,12,14,20,30,32]),ONLYEXEC=new Set([9,35,37]),EXEC_TXT='مسموح بخانة الإعدام فقط',BADGE_TXT='إعدام فقط';
const zones=()=>[...board.querySelectorAll('.zone')];
const toast=document.getElementById('toast');
let selected=null,tt=null;
function place(c,z,ref){
  if(ref&&ref.parentNode===z)z.insertBefore(c,ref);else z.appendChild(c);
  const zi=zones().indexOf(z),last=zones().length-1;
  if(zi>=0&&zi!==last&&ONLYEXEC.has(+c.dataset.id)&&!c.dataset.busy){
    c.dataset.busy='1';c.classList.add('nope');
    setTimeout(()=>{zones()[last].appendChild(c);upd();
      toast.textContent=EXEC_TXT;toast.classList.add('show');clearTimeout(tt);
      tt=setTimeout(()=>{toast.classList.remove('show');
        if(ref&&ref.parentNode===z)z.insertBefore(c,ref);else z.appendChild(c);
        c.classList.remove('nope');delete c.dataset.busy;upd();},2300);
    },550);
    upd();return;
  }
  if(zi>0&&PRANK.has(+c.dataset.id)&&!c.dataset.busy){
    c.dataset.busy='1';c.classList.add('nope');
    setTimeout(()=>{zones()[0].appendChild(c);upd();
      toast.textContent='اختار اللي انت عايزو ياحبيبي';toast.classList.add('show');clearTimeout(tt);
      tt=setTimeout(()=>{toast.classList.remove('show');
        if(ref&&ref.parentNode===z)z.insertBefore(c,ref);else z.appendChild(c);
        c.classList.remove('nope');delete c.dataset.busy;upd();},2300);
    },550);
  }
  upd();
}
const clearSel=()=>{if(selected)selected.classList.remove('sel');selected=null;};
function upd(){const n=pool.querySelectorAll('.card-i').length;count.textContent=n?n+' باقي':'خلصت';
  let e=pool.querySelector('.empty');if(!n&&!e){e=document.createElement('div');e.className='empty';e.textContent='رتّبتي الكل، احفظي الصورة';pool.appendChild(e);}if(n&&e)e.remove();}
function makeCard(src,i){
  const d=document.createElement('div');d.className='card-i';d.draggable=true;d.dataset.id=i;
  const im=new Image();im.src=src;im.alt='';d.appendChild(im);
  if(ONLYEXEC.has(i)){d.classList.add('ex');const bd=document.createElement('span');bd.className='badge';bd.textContent=BADGE_TXT;d.appendChild(bd);}
  d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',String(i));d.style.opacity=.4;});
  d.addEventListener('dragend',()=>d.style.opacity=1);
  d.addEventListener('click',e=>{
    e.stopPropagation();
    if(selected===d){clearSel();return;}
    if(selected){const s=selected;clearSel();if(s.dataset.busy)return;place(s,d.parentNode,d);return;}
    selected=d;d.classList.add('sel');
  });
  return d;
}
function build(){clearSel();pool.innerHTML='';board.querySelectorAll('.zone').forEach(z=>z.innerHTML='');IMGS.forEach((s,i)=>pool.appendChild(makeCard(s,i)));upd();}
build();
[...board.querySelectorAll('.zone'),pool].forEach(z=>{
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over');});
  z.addEventListener('dragleave',()=>z.classList.remove('over'));
  z.addEventListener('drop',e=>{
    e.preventDefault();z.classList.remove('over');
    const c=document.querySelector('.card-i[data-id="'+e.dataTransfer.getData('text/plain')+'"]');
    if(!c||c.dataset.busy)return;
    const over=e.target.closest('.card-i');let ref=null;
    if(over&&over!==c&&over.parentNode===z){const r=over.getBoundingClientRect();ref=e.clientX>r.left+r.width/2?over:over.nextSibling;}
    place(c,z,ref);
  });
  z.addEventListener('click',()=>{if(selected){const s=selected;clearSel();if(s.dataset.busy)return;place(s,z,null);}});
});
document.getElementById('reset').onclick=build;
document.getElementById('close').onclick=()=>document.getElementById('ov').hidden=true;

function wrapText(ctx,text,maxW){const w=text.split(' ');const lines=[];let cur='';
  w.forEach(x=>{const t=cur?cur+' '+x:x;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=x;}else cur=t;});lines.push(cur);return lines;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
document.getElementById('save').onclick=async()=>{
  try{await document.fonts.ready;}catch(e){}
  const F='Lalezar, Tahoma, sans-serif';
  const W=1200,m=60,lab=200,cols=7,bw=W-2*m,gridW=bw-lab,cell=gridW/cols;
  const rows=[...board.querySelectorAll('.row')].map(r=>{const l=r.querySelector('.label');return{name:l.innerText.trim(),a:l.dataset.a,b:l.dataset.b,fg:l.style.color,cards:[...r.querySelectorAll('.card-i img')]};});
  const hs=rows.map(r=>Math.max(1,Math.ceil(r.cards.length/cols))*cell);
  const headH=310,boardH=hs.reduce((a,b)=>a+b,0),H=headH+boardH+m+20;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  ctx.fillStyle='#09131c';ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(W/2,-60,10,W/2,-60,620);g.addColorStop(0,'rgba(79,184,196,.32)');g.addColorStop(1,'rgba(79,184,196,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  {const lg0=document.getElementById('logo'),R=520;ctx.save();ctx.globalAlpha=.06;ctx.beginPath();ctx.arc(W-120,H-120,R,0,7);ctx.clip();ctx.drawImage(lg0,W-120-R,H-120-R,2*R,2*R);ctx.restore();}
  // logo
  const L=130,ly=36,lg=document.getElementById('logo');
  ctx.save();ctx.shadowColor='rgba(79,184,196,.7)';ctx.shadowBlur=40;ctx.fillStyle='#4fb8c4';ctx.beginPath();ctx.arc(W/2,ly+L/2,L/2+3,0,7);ctx.fill();ctx.restore();
  ctx.save();ctx.beginPath();ctx.arc(W/2,ly+L/2,L/2,0,7);ctx.clip();ctx.drawImage(lg,W/2-L/2,ly,L,L);ctx.restore();
  ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#eef4f6';ctx.font='400 66px '+F;ctx.fillText(document.getElementById('title').innerText.trim(),W/2,ly+L+62);
  {const rg=ctx.createLinearGradient(W/2-90,0,W/2+90,0);rg.addColorStop(0,'rgba(79,184,196,0)');rg.addColorStop(.5,'#4fb8c4');rg.addColorStop(1,'rgba(79,184,196,0)');ctx.fillStyle=rg;ctx.fillRect(W/2-90,ly+L+108,180,4);}
  // board
  const bx=m,by=headH;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=40;ctx.shadowOffsetY=16;ctx.fillStyle='#101f2b';rr(ctx,bx,by,bw,boardH,26);ctx.fill();ctx.restore();
  ctx.save();rr(ctx,bx,by,bw,boardH,26);ctx.clip();
  let y=by;
  rows.forEach((r,i)=>{
    const h=hs[i],lx=bx+bw-lab;
    const lgr=ctx.createLinearGradient(lx,y,lx+lab,y+h);lgr.addColorStop(0,r.a);lgr.addColorStop(1,r.b);ctx.fillStyle=lgr;ctx.fillRect(lx,y,lab,h);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(lx,y,lab,1.5);
    ctx.fillStyle='#0c1822';ctx.fillRect(bx,y,gridW,h);
    ctx.strokeStyle='rgba(120,200,215,.14)';ctx.lineWidth=1.5;
    for(let q=0;q<Math.round(h/cell);q++)for(let c=0;c<cols;c++)ctx.strokeRect(lx-(c+1)*cell,y+q*cell,cell,cell);
    ctx.fillStyle=r.fg;ctx.font='400 '+(r.name.length>6?40:48)+'px '+F;
    const ln=wrapText(ctx,r.name,lab-24);ln.forEach((t,k)=>ctx.fillText(t,lx+lab/2,y+h/2+(k-(ln.length-1)/2)*46));
    r.cards.forEach((im,k)=>{const c=k%cols,q=Math.floor(k/cols),p=6,s=cell-2*p;const cx=lx-(c+1)*cell+p,cy=y+q*cell+p;
      ctx.save();rr(ctx,cx,cy,s,s,12);ctx.clip();ctx.drawImage(im,cx,cy,s,s);ctx.restore();
      if(ONLYEXEC.has(+im.parentNode.dataset.id)){ctx.save();ctx.font='800 14px Tajawal, Tahoma, sans-serif';const bw2=ctx.measureText(BADGE_TXT).width+18;ctx.fillStyle='#b3161f';rr(ctx,cx+(s-bw2)/2,cy+s-28,bw2,22,11);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(BADGE_TXT,cx+s/2,cy+s-17);ctx.restore();}});
    if(i<rows.length-1){ctx.strokeStyle='rgba(79,184,196,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,y+h);ctx.lineTo(bx+bw,y+h);ctx.stroke();}
    y+=h;
  });
  ctx.restore();
  ctx.strokeStyle='rgba(79,184,196,.45)';ctx.lineWidth=2;rr(ctx,bx,by,bw,boardH,26);ctx.stroke();
  cv.toBlob(async b=>{
    let ok=false;
    try{const dl=window.claude&&await Promise.race([claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),3000))]);
      if(dl){await dl.save({filename:'outlaw-tier-list.png',data:b});ok=true;}}catch(e){}
    if(!ok&&!window.claude){try{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='outlaw-tier-list.png';document.body.appendChild(a);a.click();a.remove();ok=true;}catch(e){}}
    if(!ok){document.getElementById('shot').src=cv.toDataURL('image/png');document.getElementById('ov').hidden=false;}
  },'image/png');
};
// test hook
window.__prank=()=>{const c=[...pool.querySelectorAll('.card-i')].find(x=>PRANK.has(+x.dataset.id));place(c,zones()[3],null);};
window.__fill=()=>{const z=[...board.querySelectorAll('.zone')];[...pool.querySelectorAll('.card-i')].slice(0,20).forEach((c,i)=>z[i%6].appendChild(c));upd();};
}
</script>
