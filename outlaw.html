<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تقييم كركترات اوتلاو</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-logo"></div>

  <div class="container">

    <header>
      <img src="logo.jpg" class="logo" id="logo" alt="Outlaw">
      <h1 id="title" contenteditable="true">تقييم كركترات اوتلاو</h1>
      <p class="sub">من الأسطوري إلى اللي تتمنى يعدم</p>
      <div class="line"></div>
    </header>

    <!-- جدول التقييم (يتعبى من script.js) -->
    <div class="board" id="board"></div>

    <!-- الكركترات اللي ما انحطت للحين -->
    <section class="chars">
      <h2>الكركترات <span class="count" id="count"></span></h2>
      <div class="pool" id="pool"></div>
    </section>

    <div class="buttons">
      <button class="btn-main" id="saveBtn">حفظ كصورة</button>
      <button class="btn-second" id="resetBtn">إعادة من البداية</button>
    </div>

    <p class="hint">اسحب الكركتر للمستوى، أو اضغط عليه وبعدين اضغط على المستوى.<br>تقدر تعدّل العنوان وأسماء المستويات بالضغط عليها</p>
  </div>

  <!-- رسالة المقلب -->
  <div id="popup"></div>

  <!-- تطلع إذا ما اشتغل التحميل -->
  <div id="preview" hidden>
    <p>اضغط مطوّل على الصورة واحفظها</p>
    <img id="previewImg" alt="">
    <button class="btn-second" id="closePreview">إغلاق</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
